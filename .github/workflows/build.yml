name: Build Frappe CRM Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps.json
      - .github/workflows/build.yml

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/frappe-crm-custom
  IMAGE_TAG: v1.72.0
  FRAPPE_BRANCH: version-15
  PYTHON_VERSION: "3.11.6"
  NODE_VERSION: "18.20.2"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout image repo
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Copy apps.json into frappe_docker
        run: cp apps.json frappe_docker/apps.json

      - name: Show apps.json
        working-directory: frappe_docker
        run: cat apps.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally for test
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: false
          load: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          secret-files: |
            apps_json=frappe_docker/apps.json

      - name: Test local image contains CRM
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ls -la /home/frappe/frappe-bench/apps

          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            bash -lc "cd /home/frappe/frappe-bench && python -c 'import crm; print(\"crm exists\")'"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          secret-files: |
            apps_json=frappe_docker/apps.json
